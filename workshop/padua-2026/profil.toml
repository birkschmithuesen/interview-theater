# Workshop-Profil Padua 2026
#
# Eingehaengt mit IT_WORKSHOP=padua-2026 in betrieb/<gruppe>.env.
#
# Karte A1 hat Sprache, Phasen und Formen gesetzt; den Inhalt hat Karte P
# (01.10.2026) aus zwei Vault-Dateien gefuellt -- und nur aus diesen:
#
#   V1 = projekte/padua-workshop/padua-workshop.md
#   V2 = projekte/padua-workshop/notes/inscribe-padua-todo.md
#
# Belegte Zeilen nennen ihre Quelle ("# V1: ..."). Jede Angabe, die dort
# NICHT woertlich oder eindeutig steht, traegt den Kommentar
# "# ANNAHME (unbelegt): ..." -- Birk nimmt sie am Prompt-Dump ab
# (docs/prompt-audit/2026-09-30-padua/BEFUND.md).
#
# Die Rahmen-Vorlagen, in die diese Werte eingesetzt werden, liegen in der
# Sprachschicht (interview_theater/sprachen/en/prompts/rahmen*.md,
# projekt.md). Der Satz davor lautet dort "The group are {{zielgruppe}}
# ({{zielgruppe_traeger}})." bzw. "Where it is shown: {{auffuehrungsort}}."
# -- die Werte sind deshalb Satzglieder, keine ganzen Saetze.
#
# Das Szenenmodell (E9: claude-opus-5-5) ist KEIN Profilfeld, sondern
# Betrieb: IT_SZENE_ANBIETER / IT_SZENE_MODELL in betrieb/<gruppe>.env,
# siehe LIESMICH.md.

# V1 Kopf + Eckdaten, V2 "Start Montag 05.10.2026".
beschreibung = "Five-day workshop for third-year acting students at the academy of the National Theatre of the Veneto Region (Teatro Verdi, Padova), starting Monday 5 October 2026."

[sprache]
# Prompt- und Chatsprache (Birk, 29.09.2026: Padua laeuft auf Englisch).
code = "en"
# Wie die Gruppe angesprochen wird.
anrede = "you"
# Die Interviewsprache ist offen -- Whisper erkennt sie selbst (E5). Eine
# Gruppe kann per Knopf in Phase 3 oder /sprache umstellen. Unbestaetigt,
# siehe LIESMICH.md (Annahme A1, Rauchtest Aufgabe 9 offen).
whisper = "auto"

[datenschutz]
# E8: der Bot spricht nie mit Vornamen an; im Prompt stehen "Member 1, 2, ...".
pseudonyme = true

[zielgruppe]
# V1: "14 Studierende, ein 3. Jahrgang", "auf digital/hybrid performance
# vorbereitet und bewusst dramaturgisch/regie-orientiert"; V1 To-do:
# "Studierende sind volljaehrig". Ein genaues Alter steht nirgends und
# steht deshalb auch hier nicht.
beschreibung = "adult third-year acting students, prepared for digital and hybrid performance and oriented towards dramaturgy and directing"
# V1: Akademie des National Theatre of the Veneto Region, Teatro Verdi, Padova.
traeger = "academy of the National Theatre of the Veneto Region, Teatro Verdi, Padova"

[orte]
beschreibung = "places from everyday life in Padua and Venice, where the people the group interviewed live and work -- which ones, the group decides (no example places from these instructions)."   # ANNAHME (unbelegt): V1 belegt nur, dass die Interviews in Padua/Venedig stattfinden; dass das Stueck dort spielt, ist abgeleitet -- die Geschichten sind ausdruecklich fiktiv (V1 "NICHT dokumentarisches Theater")
ausgeschlossen = ["the real home or workplace of an interviewed person, recognisable by name or address"]   # ANNAHME (unbelegt): Dortmunds Liste (Club, Disko, Alkohol ...) war Jugendschutz fuer 15-18-Jaehrige und passt nicht auf Erwachsene; ersetzt durch einen Schutz der Befragten, abgeleitet aus V1 "fiktiv, NICHT dokumentarisch" und E8 (V2) -- Birk entscheidet, ob hier etwas anderes oder gar nichts stehen soll
auffuehrung = "at the public showcase on the last day of the workshop, 10-15 minutes per group, in front of AI-generated projected backgrounds, at Teatro Verdi, Padova"   # ANNAHME (unbelegt): Werkschau Tag 5, 10-15 Min je Gruppe, KI-Hintergruende stehen in V1; der Ort der Werkschau nicht (V1 offene Punkte: "Publikum & Zugang klaeren") -- "at Teatro Verdi" ist aus dem Workshop-Ort geschlossen
# Orte, die in den Prompts als BEISPIEL vorkommen -- nicht die Orte des
# Stuecks. Englisch, weil sie in englischen Prompt-Saetzen stehen.
beispiele = ["bus stop", "piazza", "café", "station"]   # ANNAHME (unbelegt): Wahl von Karte A1, nicht aus dem Vault; stehen nur in Beispielsaetzen der Prompts

[konflikt]
erlaubt = "whatever the interviews bring up; the group sets the theme and its framing itself"   # ANNAHME (unbelegt): V1 nennt keinen Konfliktrahmen fuer die Buehne (V1 offene Punkte: "Interview-Thema / Framing mit den Studierenden setzen"); creative ownership, environmental cost, digitale Souveraenitaet sind die Reflexionsebene des Workshops, kein Stoff des Stuecks -- deshalb bewusst nicht hier
# Birk 01.10.2026 (Punkt 6): nur der Schutz der Befragten. "No glorification
# of violence" ist Dortmunds Jugendschutz und faellt weg -- hier sitzen
# Erwachsene, und was auf die Buehne darf, ist ihre kuenstlerische
# Entscheidung. Grossgeschrieben, weil die Vorlagen den Wert an einen
# Satzanfang setzen ("{{konflikt_ausgeschlossen}}.").
ausgeschlossen = "No interviewed person recognisable by name or address"

[projekt]
# V1: Titel "From Real Voices to New Fictions", "fiktive Geschichten auf
# Basis realer Interviews ... NICHT dokumentarisches Theater", "Interviews
# mit echten Menschen in Padua/Venedig -- echte Stimmen als Rohmaterial",
# "oeffentliche Werkschau". Steht im Eroeffnungstext der Interviewer.
kurzbeschreibung = "short fictional plays based on interviews with real people in Padua and Venice - the voices we collect are raw material for new stories, not a documentary, and the plays are shown at a public showcase at the end of the workshop"

# --- Laengen-Rhythmus je Szene (30.09.2026, Karte R) ----------------------
#
# Der Code waehlt je Szene ein Wortbudget aus einem Rhythmus-Muster, damit
# nicht alle Szenen gleich lang werden. Alle Zahlen hier sind VORSCHLAEGE
# und UNGEMESSEN -- sie stammen aus der Kartenbeschreibung, nicht aus einer
# Messung an einem fertigen Stueck.
#
# Zum Vergleich, was gemessen ist:
#   * Herkules.exe (prompts/formen/dialog.md): 700-1500 Woerter je Szene,
#     Median 1400, neun Szenen rund 12.300 Woerter.
#   * Dortmund Textbuch v2 (06.09.2026, Phase-6-Prosa): 825 / 802 / 603
#     Woerter -- flach, alle im gleichen Bereich. Genau dagegen ist der
#     Rhythmus gebaut.
# Die Werte unten liegen damit bei etwa einem VIERTEL des Herkules-Masses.
# Ob das der Normalfall ist oder schon die "Instagram"-Laenge, entscheidet
# Birk -- siehe OFFENE FRAGE 1 im Plan. Geaendert wird hier, nicht im Code.
[laengen]
aktiv = true
# "Kuerzer/Instagram": Faktor auf ALLE Budgets. 0,25 auf die Werte unten
# ergibt Dialog 50-110 Woerter je Szene.
kurz_faktor = 0.25
# Ab 130 % des Budgets haengt der Code GENAU EINEN Kuerzungslauf an.
nachzaehl_schwelle = 1.3
# Rueckfall fuer eine Form ohne eigenen Rahmen.
vorgabe_min = 200
vorgabe_max = 450

# Woerter je Szene, Formname -> [min, max]. Die Formnamen muessen zu
# formen.toml passen -- scripts/pruefe_profil.py meldet jeden Rahmen ohne
# Form und jede Form ohne Rahmen.
[laengen.rahmen]
dialog  = [200, 450]   # Vorschlag, ungemessen
monolog = [150, 350]   # Vorschlag, ungemessen -- die Karte nennt Monolog nicht
chor    = [80, 200]    # Vorschlag, ungemessen
lied    = [80, 200]    # Vorschlag, ungemessen
rap     = [120, 250]   # Vorschlag, ungemessen

# --- Der letzte Sprachpass ------------------------------------------------
#
# Vier Muster, mechanisch gezaehlt, ohne Modell. Ueberschreitet eines seinen
# Grenzwert, haengt derselbe EINE Lauf, der auch kuerzt, eine
# Ueberarbeitungs-Notiz an. Grenzwerte je 1.000 Woerter -- ausser dem
# Fazitsatz, der je Text zaehlt.
#
# Anker aus der Messung: Dortmund v2 hatte EINEN Gedankenstrich in 2.230
# Woertern (0,45 je 1.000). 6,0 ist also reichlich Luft und trifft nur die
# Inflation, nicht den einzelnen Strich.
[sprachpass]
aktiv = true
gedankenstriche_je_1000 = 6.0
nicht_sondern_je_1000 = 2.0
adjektiv_dreier_je_1000 = 2.0
fazitsatz_je_text = 1
