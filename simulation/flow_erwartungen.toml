198-208) enthaelt es NICHT -- nur 'interview_beenden', 'interview_benennen',
'an_den_bot'. Konkret heisst das (gelesen ueber aufnahme._teil_abschliessen,
aufnahme.py Zeile ~1406, und bot.py Zeilen 356-491): eine TEXTnachricht geht
IMMER durch bot._zug_und_erkenner -> erkenner.laufe mit der vollen
