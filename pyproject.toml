[project]
name = "theatersoap"
version = "0.1.0"
description = "Telegram-Bot fuer einen Theater-Workshop"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["theatersoap*"]
