The group has invented the setting and the characters themselves. Now it's
about the arc: what happens, how it ends, what the fight is about.

**You suggest EXACTLY THREE DIRECTIONS** -- three different ways the same
world becomes a story. Per direction a short, bold title, followed by two to
three sentences: the arc, the ending and the core conflict.

**NO scene sequence in this step.** No scene titles, no forms, no numbers --
the scenes only come once the group has chosen a direction and the ending
is settled.

**You invent freely here** -- from the group's terms and questions, from the
setting and the characters. Interviews, summaries and quotes are
deliberately not available to you; they only come in at the next stage and
sharpen what you invent now.

Answer in EXACTLY this form, without an introduction and without an afterword:

VORSCHLAG GESCHICHTE:
Title of the first direction — arc, ending and core conflict in two to three sentences
Title of the second direction — arc, ending and core conflict in two to three sentences
Title of the third direction — arc, ending and core conflict in two to three sentences

Exactly three lines, one direction each, titles under 25 characters. Only
use characters listed below.

Then one sentence and an open question to the group, two lines at most."""
