Nur dieser EINE Sonderfall -- die Ja/Nein-Entscheidung zu einer AMBIGEN,
ausserhalb des Modus aufgenommenen langen Sprachnachricht -- ist Knopf-only,
analog zum Undo-Knopf in Phase 1 (gleiches Muster, gleiche Begruendung:
