# Was die Gruppe beim Eintritt in eine Phase im Chat liest -- Padua 2026,
# englisch (Karte A1). Birk nimmt den Wortlaut in Karte P ab.
#
# Vier Regeln, aus dem Dortmunder Betrieb:
#
# 1. Zwei bis vier Saetze, hoechstens 700 Zeichen
#    (phasentexte.EINLEITUNG_GRENZE).
# 2. Keine Eigennamen -- weder erfundene Figuren noch Orte: was hier als
#    Beispiel steht, taucht spaeter als Vorschlag des Bots wieder auf.
# 3. Keine Slash-Befehle. Beworben wird der Knopf.
# 4. Die Anrede aus profil.toml (sprache.anrede = "you") durchhalten.
#
# {{formen_liste_oder}} und die uebrigen Platzhalter funktionieren auch
# hier -- damit im Chat dieselbe Formenliste steht wie im Prompt.

letzte_offen = """\
Here is your script in one piece. Some of the scenes are not written yet - \
tap one of them and I'll catch up. In the finished ones we look at the \
transitions and at whatever feels awkward to say out loud."""

[einleitung]
1 = """\
This is where your list of terms from the plenary comes to me. Send it typed \
or as a voice message, just as it is on your wall. I keep it, sort it and ask \
where a term is still too big. At the end you have the core terms you will \
keep working with."""
2 = """\
Now you write your own interview questions for your terms first, as a \
group, in chat or by voice. Once you have enough, I show you questions I \
would suggest for the same terms, side by side with yours, and you decide \
question by question what stays, what goes and what gets reworked. Then \
we agree on how you open and close a conversation. At the end you have an \
interview guide to take with you."""
# Phase 3: Padua arbeitet nur im Browser -- die Knopfnamen sind die des
# Rekorders (sprachen/en/texte.toml, web_chat: _TEXT_INTERVIEW_AN/_PAUSE/
# _WEITER/_ENDEN), keine Sprachnachrichten, kein "say done" (P34 A8).
3 = """\
Now you do the interviews - you have the guide with you. Tap Start interview \
and the phone records the conversation; with ⏸ Pause and ▶ Continue you can \
interrupt it. When the interview is over, tap ■ Stop. I type everything up \
and summarise the interview by myself - the themes and the word-for-word \
quotes we will work with later. For the next person, tap Start interview \
again."""
4 = """\
From here on we invent - freely, without material. You decide where your play \
is set (place, time, occasion), who is in it, and what happens: the story in \
outline, how it ends, and the sequence of scenes with a title, one sentence, \
the characters and a suggested form. I help with suggestions if you want. \
Right after that the interviews come in and sharpen what you have built. \
To brainstorm, press "Start listening" - the same button as in phase 1 - \
and just talk; the CoThinker tab shows its thoughts from time to time. \
Press "Discussion done" when you are finished."""
5 = """\
Now the interviews come back automatically: next to every scene and every \
character I place the passages from your recordings that fit, with the \
word-for-word quote, and your story becomes more precise without changing. \
Then I put the whole story in front of you as a short overview - the arc, \
the setting, the characters and one or two sentences per scene - and you \
say whether it fits or needs another look. Once it does, I write the scenes \
one after another as prose, and you confirm each one before the next."""
6 = """\
First you read the whole story in the Script tab and tell me where it should \
go. Then we go scene by scene into the fine-tuning."""
7 = """\
Now the story becomes a play: first you choose a form for each scene, then \
how each character speaks, then we transfer scene by scene. At the end I \
check the whole script once."""
