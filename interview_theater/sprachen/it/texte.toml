# Italienische Texttabelle -- NUR fuer Module, die eine ``Texte``-Instanz
# mit ``ab_phase67_italienisch=True`` tragen (Morgen-Auftrag 4, 08.10.2026:
# ab Phase 6/7 italienisch fuer alle Padua-Gruppen, Knoepfe bleiben
# englisch). Anders als ``sprachen/en/texte.toml`` ist diese Tabelle NICHT
# vollstaendig fuer jedes Modul -- nur die Module, die den Schalter
# tatsaechlich nutzen (``szenenkarte.py``, ``stagescript.py``), und darin
# nur die Konstanten, die ueber ``T_IT`` statt ``T`` gelesen werden (die
# beiden Knopf-Beschriftungen bleiben aussen vor). ``tests/test_sprache_texte.py``
# prueft nur die englische Tabelle, nicht diese hier.

