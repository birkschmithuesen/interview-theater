279). Beide Wege -- freier Erkenner-Intent und Menue-Knopf des
Bot-Vorschlags -- schreiben am Ende arbeitsstand.geschichte und sind
gleichwertige, parallele Pfade; keiner ersetzt den anderen.
"""

