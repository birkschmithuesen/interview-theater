5 = """\
Jetzt kommen die Interviews zurueck. Ich lege neben jede Szene und \
jede Figur die Stellen aus euren Aufnahmen, die dazu passen, mit dem \
woertlichen Zitat. Eure Geschichte aendert sich dadurch nicht, sie \
wird genauer. Ihr entscheidet Vorschlag fuer Vorschlag und koennt \
noch eine Runde drehen."""

6 = """\
Jetzt schreibe ich eure Geschichte am Stueck - eine Kurzgeschichte, \
wie in einem Buch: was passiert, wer da ist, was gesagt und gefuehlt \
wird, in Prosa. Wie viele Abschnitte es werden, entscheidet die \
Geschichte. Aus jedem Abschnitt wird danach eine Szene. Kein \
