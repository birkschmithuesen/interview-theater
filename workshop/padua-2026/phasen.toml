# Die Arbeitsphasen fuer Padua 2026 (Karte A1): dieselben sieben Stationen
# wie in Dortmund -- die Methode, nicht der Einsatzort --, englisch benannt.
#
# stichwoerter sind Wortstaemme; verglichen wird in beide Richtungen
# (phasen.nummer_fuer), die erste Phase in Nummernfolge gewinnt. Phase 4
# traegt auch die Woerter der alten Phasenliste ("core theme", "format"),
# weil der englische Erkenner-Prompt sie noch nennt. ``vorrang`` (je Phase,
# optional): Wendungen, die vor allen Stichwoertern geprueft werden, nur in
# Richtung "steht im Gesagten" (workshop.phasen_vorrang).
erste = 1
meldung = "We're now at {bezeichnung}. If that's not right, tell me."

[[phase]]
nummer = 1
name = "Terms"
satz = "Take in and sort the list of terms collected in the plenary."
stichwoerter = ["terms", "term", "term list", "keywords"]

[[phase]]
nummer = 2
name = "Questions"
satz = "Develop interview questions from the terms."
# "interview questions" bewusst nicht: der Vergleich laeuft in beide
# Richtungen, "interview" waere darin enthalten (wie im Deutschen).
stichwoerter = ["questions", "question", "question list"]

[[phase]]
nummer = 3
name = "Interviews"
satz = "Conduct the interviews, summarise the material."
stichwoerter = ["interviews", "interview", "recordings"]

[[phase]]
nummer = 4
name = "Frame"
satz = "Invent freely: where it is set, who is in it, what happens."
stichwoerter = ["setting", "characters", "character", "frame", "core theme",
                "format", "conflict", "story", "plot", "outline"]

[[phase]]
nummer = 5
name = "Interview Selection"
satz = "Pick and edit the interview passages for each scene."
# Umbenannt Birk 08.10.2026: "Interviews" (Birks Wunsch) traegt schon
# Phase 3, daher "Interview Selection". Die alten Stichwoerter bleiben --
# die Gruppen kennen "Prose Draft" noch. "interview selection" steht in
# ``vorrang``: das "interview" der Phase 3 steckt darin, und im Stichwort-
# Durchgang gewinnt die fruehere Phase (phasen.nummer_fuer).
vorrang = ["interview selection", "selection of interview",
           "selecting interview"]
stichwoerter = ["interview selection", "selection",
                "prose draft", "prose", "draft", "overview",
                "sharpening", "sharpen", "clustering", "summaries"]

[[phase]]
nummer = 6
name = "Scene Cards"
satz = "Turn each scene into a concept card -- one at a time."
# "scene cards" auch in ``vorrang``: sonst traefe "stage script for scene 3"
# das "scene" hier statt Phase 7 -- umgekehrt dasselbe fuer "stage script".
vorrang = ["scene cards", "scene card"]
stichwoerter = ["scene cards", "cards", "card",
                "rewrite", "rewriting", "revise", "revision",
                "scene texts", "scene text", "scenes", "scene"]

[[phase]]
nummer = 7
name = "Stage Script"
satz = "Write the stage script in your group's format, scene by scene."
vorrang = ["stage script"]
stichwoerter = ["stage script", "script",
                "stage version", "staging", "final version",
                "run-through", "polish", "play check", "review round"]
