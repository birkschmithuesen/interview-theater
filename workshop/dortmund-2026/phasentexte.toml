# Was die Gruppe beim Eintritt in eine Phase im Chat liest.
#
# Zwei bis vier Saetze je Phase: was hier passiert, was ihr tut, was ich
# tue, was am Ende steht. Das ist Bot-Text an die Gruppe und KEIN Prompt --
# er geht nie an ein Modell.
#
# Keine Eigennamen, weder erfundene Figuren noch Orte: was hier als Beispiel
# steht, taucht spaeter als Vorschlag des Bots wieder auf. Keine
# Slash-Befehle: beworben wird der Knopf.
#
# {{formen_liste_oder}} wird aus formen.toml gefuellt -- damit im Chat
# dieselbe Formenliste steht wie im Prompt.
#
# Laenge: hoechstens 700 Zeichen je Einleitung (phasentexte.EINLEITUNG_GRENZE).

# Was statt der Einleitung der letzten Phase dasteht, solange nicht jede
# Szene einen Text hat. Der alte Text fing mit "Alle Szenen stehen" an --
# ein Satz ueber die Datenlage, den der Text nicht geprueft hat.
letzte_offen = """\
Hier seht ihr euer Textbuch am Stueck. Ein Teil der Szenen ist noch \
ungeschrieben - tippt eine davon an, dann hole ich das nach. Bei den \
fertigen achten wir auf die Uebergaenge und darauf, was sich beim \
Sprechen sperrig anfuehlt."""

[einleitung]
1 = """\
Hier kommt eure Begriffsliste aus dem Plenum zu mir. Ihr schickt sie \
getippt oder als Sprachnachricht, so wie sie bei euch an der Wand \
steht. Ich halte sie fest, ordne sie und frage nach, wo ein Begriff \
noch zu gross ist. Am Ende stehen die Kernbegriffe, mit denen ihr \
weiterarbeitet."""

2 = """\
Aus euren Begriffen werden jetzt die Interviewfragen. Ich schlage \
euch zehn vor, ihr sagt mir die Nummern von genau drei. Danach \
schauen wir, welche Frage heikel ist und wie ihr sie so stellt, dass \
sie leicht zu beantworten ist, und womit ihr ein Gespraech anfangt \
und aufhoert. Am Ende habt ihr einen Leitfaden zum Mitnehmen."""

3 = """\
Jetzt fuehrt ihr die Interviews - den Leitfaden habt ihr dabei. So \
