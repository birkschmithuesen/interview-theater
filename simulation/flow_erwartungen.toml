"""

[[phase.3]]
aktion = "Weiter zu Phase 4 verlangen, waehrend ein frueher als 'zu kurz' uebersprungenes (und deshalb nie verdichtetes) Interview offen stuende -- GEGENPROBE: das blockiert die Phase-4-Sperre NICHT (mehr)"
weg = "beides"
intent = "phase_setzen"
knopf = "ART_PHASE|ART_NOCH_NICHT"
