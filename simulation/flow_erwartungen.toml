aktion = "Nach einer langen Sprachnachricht OHNE laufenden Interviewmodus ('Das klingt nach einem Interview (M:SS)') die Fragen 'Als Interview speichern?' und, bei Ja, 'Fertig, auswerten?' bzw. 'Es kommt noch was' ausschliesslich per Knopf beantworten -- bewusst kein Chat-Text-Weg"
weg = "knopf"
intent = ""
knopf = "ART_OHNE_KNOPF_JA|ART_OHNE_KNOPF_NEIN|ART_OHNE_KNOPF_FERTIG|ART_OHNE_KNOPF_WEITER"
beleg = """
Investigiert (Auftrag, Punkt 4): bewusste, dokumentierte Knopf-only-Entscheidung
(AGENTS.md, Abschnitt 'Eine lange Sprachnachricht ohne Interviewmodus wird
gefragt, nicht gedeutet' -- 'Keine Antwort -> gar nichts; kein Auto-Ja, kein
Zeitgeber'). Die vier Knoepfe (knoepfe/texte.py Zeilen 144-149) werden ueber
knoepfe/interviews.py::biete_interview_ohne_knopf/_weiter (Zeilen ~128-170)
angeboten; ihre Handler in knoepfe/wirkung.py (_wirkung_ohne_knopf_ja/_nein/
_fertig/_weiter, ~1141-1200 laut Auftrag) rufen nie ein Modell und haben
KEIN Erkenner-Gegenstueck -- erkenner.ARTEN enthaelt keine eigene Art fuer
