[[phase.4]]
aktion = "Das Setting (Ort, Zeit, Anlass) per Chat nennen oder aendern, statt die Grundleiste zu nutzen"
weg = "beides"
intent = "rahmen_setzen"
knopf = "ART_SPEICHERN|ART_ANDERS|ART_EIGENE"
beleg = """
erkenner.ARTEN enthaelt 'rahmen_setzen' (erkenner.py Zeile 84);
_ARBEITSSTAND_ARTEN (Zeilen 577-585) mappt es auf arbeitsstand.rahmen (das
Setting); nicht in PHASEN_SPEZIFISCHE_ARTEN, also phasenfrei. Knopf:
knoepfe/basis.py::offene_art (Zeile 667) liefert fuer Phase 4 zuerst
'rahmen' als offene Art, solange das Feld leer ist; sende_mit_speicherleiste()
(Zeile 468 ff -- die Zweige 'figuren' Zeile 568 und 'geschichte' Zeile 576
sind die einzigen Sonderfaelle) faellt fuer 'rahmen' auf
_sende_mit_grundleiste() (Zeile 588) zurueck, dieselbe Leiste
ART_SPEICHERN/ART_ANDERS/ART_EIGENE wie bei Begriffen/Fragen in Phase 1/2;
knoepfe/wirkung.py::_wirkung_rahmen (Zeile 1018) speichert ueber denselben
_speichere()-Weg. Der Phaseneintritt selbst (knoepfe/stationen.py::
biete_proaktiv, Zeilen 221-238) ist dabei eine OFFENE FRAGE ohne eigene
Knoepfe (Birk, 06.09.2026: 'unter einer offenen Frage gibt es keine Knoepfe,
weil dahinter nichts Fixes zu speichern ist') -- die Gruppe antwortet
zwangslaeufig in freier Sprache, und sobald diese Antwort etwas Konkretes
nennt, laeuft sie ueber rahmen_setzen wie hier beschrieben. Damit ist der
initiale Phase-4-Impuls IMMER Chat, nie ein Knopf (Auftrag, Punkt 8) -- eine
eigene Zeile fuer die offene Frage selbst waere hier redundant, weil sie
keine eigene Handlung mit Intent/Knopf ist, sondern genau in diese Zeile
(oder in figur_setzen/geschichte_setzen unten) muendet.
"""

[[phase.4]]
aktion = "Anzahl oder Namen der Figuren per Chat nennen oder aendern, statt die Anzahl-/Namen-Knoepfe der Figurenliste zu benutzen"
weg = "beides"
intent = "figur_setzen"
knopf = "ART_FIGUREN_ANZAHL_MENU|ART_FIGUREN_ANZAHL|ART_FIGUREN_ANZAHL_FREI|ART_FIGUREN_NAMEN_MENU"
beleg = """
erkenner.ARTEN enthaelt 'figur_setzen' (erkenner.py Zeile 94);
_wende_eine_an() (Zeile 1508) ruft dafuer _wende_figur_an() auf; nicht in
PHASEN_SPEZIFISCHE_ARTEN, also phasenfrei. Knopf:
knoepfe/figuren.py::biete_figurenliste() (Zeile 217 ff) bietet
ART_FIGUREN_ANZAHL_MENU ('Anzahl aendern') und ART_FIGUREN_NAMEN_MENU
('Namen aendern') PLUS die generische Grundleiste
(ART_SPEICHERN/ART_ANDERS/ART_EIGENE ueber speicherleiste(conn, chat_id,
"figuren", wert), Zeile 240) -- ART_FIGUREN_ANZAHL_MENU fuehrt weiter zu
ART_FIGUREN_ANZAHL bzw. ART_FIGUREN_ANZAHL_FREI (knoepfe/texte.py Zeilen
101-105). Beide Wege (freier Chat-Text ueber figur_setzen, oder die
Knopfkette ueber die vom Bot vorgeschlagene Liste) fuehren am Ende auf
dieselbe Tabelle figur -- ueber unterschiedliche Funktionen
(knoepfe.figuren._uebernimm_figurenliste vs. erkenner._wende_figur_an).
"""

[[phase.4]]
aktion = "Die Geschichte (Bogen + Ende) per Chat selbst erzaehlen oder aendern, statt auf das Richtungs-Menue des Bots zu reagieren"
weg = "beides"
intent = "geschichte_setzen"
knopf = "ART_GESCHICHTE_SPEICHERN|ART_EIGENE"
beleg = """
erkenner.ARTEN enthaelt 'geschichte_setzen' (erkenner.py Zeile 90);
_ARBEITSSTAND_ARTEN (Zeile 583) mappt es auf arbeitsstand.geschichte;
phasenfrei (nicht in PHASEN_SPEZIFISCHE_ARTEN) -- 'sagt die Gruppe die
Geschichte einfach, wird sie notiert wie jedes andere Arbeitsstandfeld'
(Kommentar bei der ARTEN-Definition, Zeile ~88). Knopf: fuer die Geschichte
dispatcht sende_mit_speicherleiste() NICHT auf die generische Grundleiste,
sondern auf knoepfe/szenen.py::sende_geschichte() (Zeile 204 ff, Auftrag
Punkt 7): drei Richtungen als Menue mit ART_GESCHICHTE_SPEICHERN je Option
