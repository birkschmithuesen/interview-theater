ANWEISUNGEN."1" = """\
Suggest a list of terms to the group and attach it as a block \
'VORSCHLAG BEGRIFFE:'."""
ANWEISUNGEN."2" = """\
Suggest interview questions for the group to choose from: EXACTLY FIVE per \
core term of the group, ordered by term (first all five for the first \
term, then the five for the second, and so on). Attach them as a block \
'VORSCHLAG FRAGENAUSWAHL:', one question per line in the format \
'Term: Question', without numbering. EVERY question stands on its own in \
its SENTENCE STRUCTURE: in content they may follow on from each other, but \
no question may point back to something earlier in its wording (no 'and \
then?', no 'in that moment', no 'of that', no 'this person', no 'while \
doing so') - whatever a question picks up from an earlier one, it says \
again itself ('If you have ever experienced racism: what helped you in \
that moment?') - each one must be understandable when read out on its \
own, because the group picks any three. Age-appropriate, and phrased so \
that a young interviewer from the group can ask it of a STRANGER in the \
street. Don't repeat the questions in the running text - the group sees \
the numbered list and names three numbers."""
ANWEISUNGEN."4" = """\
Suggest three settings - place, time, occasion on one line each, freely \
invented from the group's terms and questions, NOT from interviews. \
Attach them as a block 'VORSCHLAG RAHMEN:', one suggestion per line."""
_ANWEISUNG_ALLGEMEIN = """\
Suggest the next step of this phase to the group - concrete, drawn from \
the material, and finish with an open question."""
ANWEISUNG_KERNTHEMA = """\
The group has chosen the direction '{richtung}'. Suggest three to four \
concrete wordings of a core theme for it, each one with a link to the \
material. Attach them as a block 'VORSCHLAG KERNTHEMA:', one wording per \
line."""
ANWEISUNG_KERNFRAGE = """\
The group's core theme is '{kernthema}'. Sharpen it into ONE dramatic \
question. Attach it as a block 'VORSCHLAG KERNFRAGE:', with exactly these \
three lines: 'Question: What happens if ...', 'Opposition: <two wants that \
collide>', 'Stakes: <what is at stake>'. No choice, no second suggestion - \
one question."""
ANWEISUNG_FIGURENZAHL = """\
Suggest a list of characters with exactly {anzahl} characters - **freely \
invented**, from the group's terms and questions and the setting. NOT from \
the interviews: they come in later and sharpen what you invent now. Which \
{anzahl} characters does this setting need? Each one wants something. \
Attach the list as a block 'VORSCHLAG FIGUREN:', one character per line \
in the form 'Name - one sentence'."""
ANWEISUNG_NAMEN = """\
Suggest three names for this character: {zeile}. Attach them as a block \
'VORSCHLAG NAMEN:', one name per line, nothing else."""
