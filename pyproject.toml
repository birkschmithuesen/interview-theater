[project]
name = "interview-theater"
version = "0.1.0"
description = "Telegram-Bot, mit dem Gruppen aus eigenen Interviews ein Theaterstueck entwickeln"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["interview_theater*"]

[tool.pytest.ini_options]
markers = [
    # Der Browserlauf gegen einen echten Server (tests/e2e/). Er braucht
    # playwright und ein Chromium und laeuft deshalb NICHT im normalen
    # `pytest`-Lauf mit -- dort ueberspringt ihn ein importorskip. Aufruf
    # siehe tests/e2e/README.md.
    "e2e: Browserlauf mit Playwright gegen einen echten Webserver",
    # Dortmund ist eingefroren (Birk, 04.10.2026): Abnahme laeuft nur noch
    # an Padua, siehe AGENTS.md ganz oben. Ein Test, der NUR wegen
    # Dortmund-Verhalten (Profil dortmund-2026, bitgleich-Pruefung) rot
    # wird, bekommt diesen Marker statt angepasst zu werden. Normaler Lauf
    # ist `pytest -m "not dortmund"`.
    "dortmund: Test prueft Dortmund-spezifisches Verhalten, eingefroren seit 04.10.2026",
]
