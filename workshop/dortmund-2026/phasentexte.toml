in Stuecken. Ich tippe alles mit. Am Ende drueckt ihr Interview \
beenden (oder sagt am Schluss der Aufnahme "fertig"). Dann fasse ich \
das Interview von selbst zusammen - die Themen und die woertlichen \
Zitate, mit denen wir spaeter arbeiten. Am Ende steht zu jedem \
Interview eine Zusammenfassung. Danach koennt ihr die \
Zusammenfassung und das Transkript ansehen und gegenpruefen."""

4 = """\
Ab hier wird erfunden - ganz frei, ohne Material. Ihr denkt euch \
aus, wo euer Stueck spielt (Ort, Zeit, Anlass), wer darin vorkommt, \
und was passiert: die Geschichte im Groben, wie sie ausgeht, und die \
Szenenfolge mit Titel, einem Satz, den Figuren und einem Vorschlag \
fuer die Form. Ich helfe mit Vorschlaegen, wenn ihr wollt. Direkt \
danach kommen die Interviews ins Spiel und schaerfen, was ihr gebaut \
