[project]
name = "interview-theater"
version = "0.1.0"
description = "Telegram-Bot, mit dem Gruppen aus eigenen Interviews ein Theaterstueck entwickeln"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["interview_theater*"]
