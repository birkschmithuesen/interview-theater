ANWEISUNGEN."1" = """\
Suggest a list of terms to the group and attach it as a block \
'VORSCHLAG BEGRIFFE:'."""
ANWEISUNGEN."2" = """\
Suggest interview questions for the group to choose from: EXACTLY FIVE per \
core term of the group, ordered by term (first all five for the first \
term, then the five for the second, and so on). Attach them as a block \
'VORSCHLAG FRAGENAUSWAHL:', one question per line in the format \
'Term: Question', without numbering. EVERY question stands on its own in \
its SENTENCE STRUCTURE: in content they may follow on from each other, but \
no question may point back to something earlier in its wording (no 'and \
then?', no 'in that moment', no 'of that', no 'this person', no 'while \
doing so') - whatever a question picks up from an earlier one, it says \
again itself ('If you have ever experienced racism: what helped you in \
that moment?') - each one must be understandable when read out on its \
own, because the group picks any three. Age-appropriate, and phrased so \
that a young interviewer from the group can ask it of a STRANGER in the \
street. Don't repeat the questions in the running text - the group sees \
the numbered list and names three numbers."""
ANWEISUNGEN."4" = """\
Suggest three settings - place, time, occasion on one line each, freely \
invented from the group's terms and questions, NOT from interviews. \
Attach them as a block 'VORSCHLAG RAHMEN:', one suggestion per line."""
_ANWEISUNG_ALLGEMEIN = """\
Suggest the next step of this phase to the group - concrete, drawn from \
the material, and finish with an open question."""
ANWEISUNG_KERNTHEMA = """\
The group has chosen the direction '{richtung}'. Suggest three to four \
concrete wordings of a core theme for it, each one with a link to the \
material. Attach them as a block 'VORSCHLAG KERNTHEMA:', one wording per \
line."""
ANWEISUNG_KERNFRAGE = """\
The group's core theme is '{kernthema}'. Sharpen it into ONE dramatic \
question. Attach it as a block 'VORSCHLAG KERNFRAGE:', with exactly these \
three lines: 'Question: What happens if ...', 'Opposition: <two wants that \
collide>', 'Stakes: <what is at stake>'. No choice, no second suggestion - \
one question."""
ANWEISUNG_FIGURENZAHL = """\
Suggest a list of characters with exactly {anzahl} characters - **freely \
invented**, from the group's terms and questions and the setting. NOT from \
the interviews: they come in later and sharpen what you invent now. Which \
{anzahl} characters does this setting need? Each one wants something. \
Attach the list as a block 'VORSCHLAG FIGUREN:', one character per line \
in the form 'Name - one sentence'."""
ANWEISUNG_NAMEN = """\
Suggest three names for this character: {zeile}. Attach them as a block \
'VORSCHLAG NAMEN:', one name per line, nothing else."""
ANWEISUNG_DUKTUS = """\
Suggest two to three alternative descriptions of how {name} speaks - one \
line each, concrete (sentence length, filler words, pace). Attach them as \
a block 'VORSCHLAG DUKTUS:', one description per line."""
ANWEISUNG_FRAGEN_ANDERE = """\
Suggest exactly ten OTHER interview questions. We have already had these, \
take none of them again and don't reword any of them:\n{alte}\n\
Attach the new ones as a block 'VORSCHLAG FRAGENAUSWAHL:', one question per \
line, exactly ten lines. Don't repeat them in the running text."""
ANWEISUNG_FRAGEN_EIGENE = """\
The group has named questions of its own. Take them unchanged as the first \
lines and add your own suggestions to make exactly ten. Attach everything \
as a block 'VORSCHLAG FRAGENAUSWAHL:', one question per line."""
ANWEISUNG_EINLEITUNGEN = """\
Look at these interview questions from the group:\n{fragen}\n\n\
The interviews are carried out by young people from the group with \
STRANGERS in the street or in their neighbourhood. Check each question: \
does it touch on a sensitive topic (family, origin, religion, violence, \
love and the body, money, illness, flight, discrimination)? Rewrite EVERY \
sensitive question as ONE gentle piece of conversation - two to three \
sentences that the interviewer says in one go: the reason, the freedom \
not to answer, and the question itself, in ONE flow. Not a lead-in and a \
question strung together, but one text that you say just like that. \
Informal 'you', easy to say out loud, in the tone of a young person \
speaking to a stranger - no officialese, no stock phrases like 'as part \
of our \
project'. The core of the question stays the same: don't invent a new \
topic and don't leave one out. Attach this as a block \
'VORSCHLAG FRAGEN WEICH:', one line each as \
'<question number> — <softer version>' - only for the sensitive questions, \
the others stay as they are. If no question is sensitive, write exactly \
this one line in the block: 'None of the questions needs a special \
lead-in.' In the text before it, say in ONE sentence which questions you \
have worded more softly - call it 'softer wording', NOT 'lead-in': the \
opening of the interview only comes in the next message, don't announce it \
here and don't write it. Ask the group at most one question. Don't copy \
out the list of questions again unchanged."""
ANWEISUNG_EROEFFNUNG = """\
Now we still need how the interview starts and how it ends. Suggest an \
opening text that the interviewer says to a stranger before they ask the \
first question - three to five sentences: who we are, what it is about \
({{projekt_kurz}}), what the answers will be used for (anonymously, as \
material for a play), that you can stop at any time, and asking \
permission to record the conversation. Add a short closing: thanks and \
what happens next. Attach both as a block 'VORSCHLAG EROEFFNUNG:' - first \
the opening, then a line that starts with 'ABSCHLUSS:'. Language like a \
young person's, no official-sounding sentences. The text stands ONLY in the \
block - don't also write it before it in the running text; before it, at \
most one sentence and one question."""

